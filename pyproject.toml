[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sequential-watermarking"
version = "0.1.0"
description = "Research implementations of sequential Monte Carlo tests for LLM watermarks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "torch>=2.1,<3",
  "Cython>=3,<4",
]

[project.optional-dependencies]
experiments = [
  "transformers>=4.30,<4.31",
  "datasets>=2.16,<3",
  "huggingface-hub>=0.20,<1",
  "nltk>=3.8,<4",
  "sentencepiece>=0.1.99,<1",
  "protobuf>=3.20,<4",
  "sacremoses>=0.1,<1",
  "tqdm>=4.66,<5",
]
analysis = ["pandas>=2.1,<3", "matplotlib>=3.7,<4", "seaborn>=0.12,<1", "jupyterlab>=4,<5"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/juyal-devashish/LLM-Sequential-Watermarking"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"watermarking.transform" = ["*.pyx"]
"watermarking.gumbel" = ["*.pyx"]
"watermarking.kirchenbauer.homoglyph_data" = ["*.json"]
